{% extends "logbook/base.html" %}
{% block title %}{{ title }} - The Logbook{% endblock %}
{% block content %}
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="actions">
      <button class="primary" type="submit">Save</button>
      <a class="button" href="{% url 'gym_list' %}">Cancel</a>
      {% if gym %}<a class="button" href="{% url 'gym_delete' gym.pk %}">Delete</a>{% endif %}
    </div>
  </form>
{% endblock %}
