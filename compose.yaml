# One file runs both workflows:
#   Development: `docker compose up -d db` starts only Postgres; run the app with `uv run`.
#   Production:  `docker compose up -d --build` starts the app and Postgres. Copy
#                .env.example to .env and fill it in first (.env is git-ignored).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logbook}
      POSTGRES_USER: ${POSTGRES_USER:-logbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logbook}
    ports:
      # Host only, for `uv run` in development. Never the whole network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Always production mode here, whatever .env says.
      DJANGO_DEBUG: "false"
      # Unset values become empty and the app refuses to start (see settings.py).
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-logbook}
      POSTGRES_USER: ${POSTGRES_USER:-logbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logbook}
    ports:
      # Host only: Tailscale serve fronts this. Not published to the network.
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
